name: Flutter CI Analysis
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *' # Hourly, after the test workflow; default branch only.
permissions:
  contents: read
  actions: read
concurrency:
  group: flutter-ci-analysis
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/ci_reports/requirements.txt
      - name: Collect attempts and build report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tool/ci_reports/report.py --repo "$GITHUB_REPOSITORY" --restore-latest --output build/ci-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-ci-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-report/
          if-no-files-found: error
          retention-days: 90
